name: PR to main

on:
  pull_request:
    branches: main

env:
  CARGO_TERM_COLOR: always
  # All features that build on stable Rust
  STABLE_FEATURES: chrono,lettre,rust-decimal,tokio,uuid-extra,derive,double-tuples,tripple-tuples,way-too-many-tuples
  # Features that require the nightly toolchain
  UNSTABLE_FEATURES: nightly-float

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --features "${{ env.STABLE_FEATURES }}" -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --features "${{ env.STABLE_FEATURES }}"

  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p rs-autofixture --features "${{ env.STABLE_FEATURES }},${{ env.UNSTABLE_FEATURES }}"
