name: Publish release

on:
  release:
    types: published

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # rs-autofixture-derive must publish first, rs-autofixture depends on it.
      # Skip if the referenced version is already published.
      - name: Publish rs-autofixture-derive
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          VERSION=$(grep -m1 '^version = ' autofixture_derive/Cargo.toml | sed -E 's/version = "(.*)"/\1/')

          # crates.io's API 403s the default Curl User-Agent...
          # It needs something that identifies the caller before it'll respond.
          if curl -sf -A "rs-autofixture-ci" "https://crates.io/api/v1/crates/rs-autofixture-derive/$VERSION" >/dev/null; then
            echo "rs-autofixture-derive $VERSION already published, skipping"
          else
            cargo publish -p rs-autofixture-derive --locked
          fi

      - name: Publish rs-autofixture
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          VERSION=$(grep -m1 '^version = ' autofixture/Cargo.toml | sed -E 's/version = "(.*)"/\1/')

          if curl -sf -A "rs-autofixture-ci" "https://crates.io/api/v1/crates/rs-autofixture/$VERSION" >/dev/null; then
            echo "rs-autofixture $VERSION already published, skipping"
          else
            cargo publish -p rs-autofixture --locked
          fi
