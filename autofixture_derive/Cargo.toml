[package]
name = "rs-autofixture-derive"
version = "0.2.0"
edition = "2024"
description = "Derive macro for rs-autofixture - automatically implement AutoFixture for structs, enums, and unions"
license = "MIT"
repository = "https://github.com/BilbyFactor/rs-autofixture"
keywords = ["testing", "fixture", "derive", "autofixture"]
categories = ["development-tools::testing"]

[lib]
proc-macro = true

[dependencies]
case = "1.0"
convert_case = "0.11"
proc-macro2 = "1.0"
quote = "1.0"
syn = "3.0"
